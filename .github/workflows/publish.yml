name: Publish package and MCP server

on:
   workflow_dispatch:
   push:
      tags:
         - "v*"

jobs:
   publish:
      runs-on: ubuntu-latest
      if: github.repository == 'faulkj/legion-mcp'
      permissions:
         id-token: write
         contents: read
      steps:
         - name: Checkout
           uses: actions/checkout@v7

         - name: Setup Node
           uses: actions/setup-node@v7
           with:
              node-version: 24
              registry-url: "https://registry.npmjs.org"
              package-manager-cache: false

         - name: Update npm
           run: npm install -g npm@latest

         - name: Install dependencies
           run: npm ci

         - name: Verify release versions
           run: |
              node -e "const p=require('./package.json'),s=require('./server.json'),v=p.version; if(s.version!==v||s.packages?.[0]?.version!==v) throw new Error('package.json and server.json versions must match'); const tag=process.env.GITHUB_REF_TYPE==='tag'?process.env.GITHUB_REF_NAME:null; if(tag&&tag!=='v'+v) throw new Error('Tag '+tag+' does not match v'+v)"

         - name: Build
           run: npm run build

         - name: Install MCP publisher
           run: |
              curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

         - name: Validate MCP manifest
           run: ./mcp-publisher validate

         - name: Publish package to npm
           run: |
              PACKAGE=$(node -p "require('./package.json').name")
              VERSION=$(node -p "require('./package.json').version")
              if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
                 echo "$PACKAGE@$VERSION is already published"
              else
                 npm publish
              fi
           env:
              NPM_CONFIG_PROVENANCE: true

         - name: Authenticate to MCP Registry
           run: ./mcp-publisher login github-oidc

         - name: Publish to MCP Registry
           run: ./mcp-publisher publish
