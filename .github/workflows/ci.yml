name: CI

on:
   push:
      branches:
         - main
   pull_request:
      branches:
         - main

permissions:
   contents: read

jobs:
   validate:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v7

         - name: Setup Node
           uses: actions/setup-node@v7
           with:
              node-version: 24
              package-manager-cache: false

         - name: Install dependencies
           run: npm ci

         - name: Set MCP manifest version
           run: |
              node -e "const fs=require('fs'),p=require('./package.json'),s=require('./server.json'); s.version=p.version; let found=false; for(const pkg of s.packages??[]) if(pkg.identifier===p.name){pkg.version=p.version;found=true} if(!found) throw new Error('server.json has no package entry for '+p.name); fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"

         - name: Build
           run: npm run build

         - name: Inspect package
           run: npm pack --dry-run

         - name: Lint workflows
           run: |
              bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
              ./actionlint

         - name: Install MCP publisher
           run: |
              curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

         - name: Validate MCP manifest
           run: ./mcp-publisher validate
